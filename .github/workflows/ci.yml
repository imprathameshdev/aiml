name: CI & Unit Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend_tests:
    name: Frontend Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm test -- --run

      - name: Verify Production Build
        working-directory: ./frontend
        run: npm run build

  backend_tests:
    name: Backend Unit Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Runtime and Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libcairo2-dev \
            libgirepository-2.0-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-0 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f "vulturevision-1.0.0-cp312-cp312-linux_x86_64.whl" ]; then
            pip install ./vulturevision-1.0.0-cp312-cp312-linux_x86_64.whl
          fi

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: python -m pytest
